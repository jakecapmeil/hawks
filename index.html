<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Hawks Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --ink:#241934;
    --ink-soft:#8a8095;
    --bg:#f3efe9;
    --card:#ffffff;
    --line:#e7e1d8;
    --gold:#7a4fae;
    --gold-bg:#ece1f7;
    --gold-ink:#4f3370;
    --green:#1c7f4c;
    --green-bg:#dcf3e4;
    --red:#c23b3b;
    --red-bg:#fbe3e3;
    --info:#1c6b8a;
    --info-bg:#e1eef3;
    --practice:#e0a415;
    --practice-bg:#faf0d2;
    --meet:#7a4fae;
    --meet-bg:#ece1f7;
    --other:#241934;
    --other-bg:#e5e1e8;
    --muted-bg:#e7e1d8;
    --r-card:14px;
    --r-control:10px;
    --r-pill:7px;
    --btn-h:38px;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;background:#f3efe9;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:18px 14px 40px;
  }
  .wrap{max-width:460px;margin:0 auto;}

  /* header */
  header{
    margin-bottom:4px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  h1{
    font-family:'Archivo',sans-serif;
    font-weight:900;
    font-size:clamp(24px,7.5vw,30px);
    letter-spacing:-0.5px;
    margin:0;
    line-height:1;
  }
  h1 span{color:var(--gold);}
  #secretTapZone{color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;}
  .tagline{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:4px;
  }

  /* contact icons */
  .contact-row{display:flex;gap:8px;flex-shrink:0;padding-top:2px;}
  .icon-btn{
    width:30px;height:30px;
    display:block;
    text-decoration:none;
    background:none;border:none;padding:0;cursor:pointer;
  }
  .icon-btn img{width:30px;height:30px;display:block;}

  /* shared "dropdown physics" — every popover menu in the app opens/closes
     with this spring-y scale+fade instead of a hard display toggle */
  .pop-menu{
    display:flex;flex-direction:column;gap:2px;
    background:#fff;border:1px solid var(--line);border-radius:var(--r-control);
    box-shadow:0 10px 28px rgba(36,25,52,0.18);
    padding:5px;z-index:20;
    opacity:0;visibility:hidden;pointer-events:none;
    transform:translateY(-6px) scale(0.96);
    transition:opacity .15s ease, transform .22s cubic-bezier(.34,1.56,.64,1), visibility .15s;
  }
  .pop-menu.show{
    opacity:1;visibility:visible;pointer-events:auto;
    transform:translateY(0) scale(1);
  }
  .pop-menu button{
    height:34px;padding:0 10px;
    background:transparent;border:none;color:var(--ink);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    text-align:left;border-radius:8px;cursor:pointer;white-space:nowrap;
  }
  .pop-menu button:hover{background:var(--bg);}

  .email-menu-wrap{position:relative;}
  .email-menu{
    position:absolute;top:38px;right:0;transform-origin:top right;
    min-width:160px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r-card);
    padding:16px;
    margin-bottom:14px;
  }

  /* identity, inside calendar card */
  .identity-block{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line);}
  .who-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  .tag-row{display:none;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .tag-row.show{display:flex;}
  .tag-btn{
    display:inline-flex;align-items:center;gap:6px;
    height:32px;padding:0 12px;
    border-radius:var(--r-control);
    border:1px solid var(--line);
    background:#fff;color:var(--ink);
    font-size:12px;font-weight:600;
    cursor:pointer;
  }
  .tag-btn svg{width:15px;height:15px;flex-shrink:0;display:block;}
  .tag-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .person-tags{display:inline-flex;gap:4px;flex-shrink:0;}
  .tag-icon{display:inline-flex;width:13px;height:13px;flex-shrink:0;}
  .tag-icon svg{width:100%;height:100%;display:block;}
  select, input[type=text], input[type=time], textarea{
    font-family:'Inter',sans-serif;
    font-size:14px;
    border-radius:var(--r-control);
    border:1px solid var(--line);
    padding:9px 11px;
    background:#fff;
    color:var(--ink);
  }
  textarea{width:100%;resize:vertical;min-height:52px;}
  select{flex:1;min-width:110px;height:var(--btn-h);}

  /* custom dropdown — replaces native <select> everywhere in the app */
  .dd{position:relative;flex:1;min-width:110px;}
  .dd-trigger{
    width:100%;height:var(--btn-h);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:0 11px;border-radius:var(--r-control);
    border:1px solid var(--line);background:#fff;color:var(--ink);
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
    cursor:pointer;
  }
  .dd-trigger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;}
  .dd-trigger .dd-chevron{width:15px;height:15px;flex-shrink:0;color:var(--ink-soft);transition:transform .2s ease;}
  .dd.open .dd-trigger{border-color:var(--ink);}
  .dd.open .dd-chevron{transform:rotate(180deg);}
  .dd-menu{
    position:absolute;top:calc(100% + 6px);left:0;right:0;
    min-width:180px;max-height:260px;overflow-y:auto;
    transform-origin:top center;
  }
  .dd-option{
    height:36px;padding:0 10px;border-radius:8px;border:none;
    background:transparent;color:var(--ink);flex-shrink:0;
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;
    text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;
  }
  .dd-option:hover{background:var(--bg);}
  .dd-option.active{background:var(--gold-bg);color:var(--gold-ink);}
  .dd-option .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  button{
    font-family:'Inter',sans-serif;
    height:var(--btn-h);
    padding:0 16px;
    border-radius:var(--r-control);
    font-size:13px;
    font-weight:600;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
  }
  button:active{transform:scale(0.98);}
  button.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
  }

  .active-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    height:var(--btn-h);
    font-family:'Space Mono',monospace;
    font-size:12px;
    padding:0 12px;
    border-radius:var(--r-control);
    background:var(--ink);
    color:#fff;
    max-width:100%;
    overflow:hidden;
    cursor:pointer;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
  }
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}

  #newPersonRow{display:none;flex-direction:column;gap:10px;margin-top:10px;}
  #newPersonRow.show{display:flex;}
  #editPersonRow{display:none;flex-direction:column;gap:10px;margin-top:10px;}
  #editPersonRow.show{display:flex;}
  .color-pick-row{display:flex;align-items:center;gap:10px;}
  .color-pick-row input[type=color]{
    -webkit-appearance:none;appearance:none;
    width:36px;height:36px;
    border:1px solid var(--line);
    border-radius:50%;
    padding:0;background:none;cursor:pointer;overflow:hidden;
  }
  .color-pick-row input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
  .color-pick-row input[type=color]::-webkit-color-swatch{border:none;border-radius:50%;}
  .color-hex{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
  .hint{font-size:11.5px;color:var(--ink-soft);}

  /* month nav + toolbar */
  .month-nav{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;gap:6px;
  }
  .month-nav .label{
    font-family:'Archivo',sans-serif;font-weight:800;
    font-size:clamp(15px,4.5vw,18px);letter-spacing:-0.3px;
  }
  .navbtn{
    background:var(--bg);color:var(--ink);border:1px solid var(--line);
    width:var(--btn-h);height:var(--btn-h);border-radius:50%;
    font-size:15px;line-height:1;padding:0;flex-shrink:0;
  }
  .cal-toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;gap:8px;flex-wrap:wrap;
  }
  #editModeBtn.active{background:var(--green);border-color:var(--green);}
  .edit-banner{
    display:none;background:var(--green-bg);color:var(--green);
    border:1px solid var(--green);border-radius:var(--r-control);
    padding:0 10px;height:var(--btn-h);font-size:12.5px;font-weight:600;
    margin-bottom:10px;align-items:center;justify-content:space-between;gap:8px;
  }
  .edit-banner.show{display:flex;}
  .edit-banner button{
    height:28px;padding:0 10px;font-size:11.5px;border-radius:var(--r-pill);
    background:#fff;color:var(--green);border:1px solid var(--green);
  }

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .dow{
    text-align:center;font-family:'Space Mono',monospace;
    font-size:9.5px;color:var(--ink-soft);padding-bottom:4px;
  }
  .day{
    aspect-ratio:1/1;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:3px 1px;cursor:pointer;position:relative;
  }
  .day:active{background:#ece6dc;}
  .day.empty{visibility:hidden;cursor:default;}
  .day .num{font-family:'Archivo',sans-serif;font-weight:700;font-size:11.5px;}
  .day.selected{outline:2px solid var(--ink);}
  .day.today{background:var(--gold-bg);border-color:var(--gold);}
  .day.today .num{color:var(--gold-ink);}
  .day.edit-target{background:var(--green-bg);border-color:var(--green);}
  .event-marks{display:flex;gap:2px;justify-content:center;margin-top:2px;height:3px;}
  .event-marks .e{width:9px;height:3px;border-radius:2px;}
  .dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px;max-width:100%;}
  .dots .d{width:5px;height:5px;border-radius:50%;}
  .day.you-away{opacity:0.5;}

  /* day menu */
  #dayDetail{display:none;}
  #dayDetail.show{display:block;}
  #dayDetail h3, .card-title{
    font-family:'Archivo',sans-serif;font-weight:800;
    font-size:18px;margin:0 0 12px;letter-spacing:-0.2px;
  }
  .section-label{
    font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;
    letter-spacing:1.5px;color:var(--ink-soft);margin:16px 0 8px;
  }
  .section-label:first-child{margin-top:0;}

  .event-row{
    padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .event-row:last-child{border-bottom:none;}
  .event-header{display:flex;align-items:stretch;gap:9px;}
  .event-bar{width:3px;border-radius:2px;background:var(--ink);flex-shrink:0;align-self:stretch;}
  .event-title{
    font-weight:600;font-size:13.5px;flex:1;align-self:center;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .event-time{font-family:'Space Mono',monospace;font-size:11px;color:var(--gold);font-weight:700;align-self:center;}
  .event-type-pill{
    align-self:center;flex-shrink:0;
    font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.5px;
    padding:3px 7px;border-radius:var(--r-pill);
  }
  .event-desc{font-size:12.5px;color:var(--ink-soft);margin:5px 0 0 12px;}
  .no-events{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;}
  #eventFormRow{display:none;flex-direction:column;gap:8px;margin-top:10px;}
  #eventFormRow.show{display:flex;}
  #eventFormRow .btn-row{display:flex;gap:8px;}

  /* event type picker — segmented slider */
  .event-type-picker{
    position:relative;display:flex;gap:2px;
    background:var(--bg);border:1px solid var(--line);
    border-radius:calc(var(--r-control) + 2px);padding:3px;margin-top:2px;
  }
  .event-type-slider{
    position:absolute;top:3px;left:3px;
    height:calc(100% - 6px);width:calc(33.333% - 2px);
    border-radius:calc(var(--r-control) - 1px);background:var(--practice);
    transform:translateX(0%);
    transition:transform .24s cubic-bezier(.4,0,.2,1), background-color .24s ease;
    box-shadow:0 1px 3px rgba(36,25,52,0.25);
  }
  .event-type-opt{
    position:relative;flex:1;z-index:1;
    height:34px;padding:0;
    background:transparent;border:none;
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;
    transition:color .2s ease;
  }
  .event-type-opt.active[data-type="practice"]{color:var(--ink);}
  .event-type-opt.active[data-type="meet"],
  .event-type-opt.active[data-type="other"]{color:#fff;}
  .event-type-label{
    font-size:10px;font-family:'Space Mono',monospace;text-transform:uppercase;
    letter-spacing:1.5px;color:var(--ink-soft);margin-bottom:2px;
  }

  .rsvp-btn{
    margin:8px 0 0 12px;
    height:28px;
    padding:0 12px;
    font-size:10.5px;
    font-family:'Space Mono',monospace;
    text-transform:uppercase;
    letter-spacing:0.5px;
    border-radius:var(--r-pill);
    border:none;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;
  }
  .rsvp-btn.unknown{background:var(--muted-bg);color:var(--ink-soft);}
  .rsvp-btn.available{background:var(--green-bg);color:var(--green);}
  .rsvp-btn.unavailable{background:var(--red-bg);color:var(--red);}
  .rsvp-btn.share-btn{background:var(--gold-bg);color:var(--gold-ink);}
  .rsvp-btn.info-btn{background:var(--info-bg);color:var(--info);}
  .rsvp-btn .rsvp-chevron{width:11px;height:11px;flex-shrink:0;}

  .rsvp-summary{margin:8px 0 0 12px;display:flex;flex-direction:column;gap:3px;}
  .rsvp-summary .grp{font-size:11.5px;line-height:1.4;}
  .rsvp-summary .grp b{font-weight:600;}
  .rsvp-summary .grp.avail{color:var(--green);}
  .rsvp-summary .grp.unavail{color:var(--red);}

  .event-actions{display:flex;gap:6px;margin:8px 0 0 12px;flex-wrap:wrap;}
  .event-actions .rsvp-btn{margin:0;}

  .roster-line{
    display:flex;align-items:flex-start;gap:8px;padding:8px 0;
    border-bottom:1px solid var(--line);font-size:13.5px;
  }
  .roster-line:last-child{border-bottom:none;}
  .roster-main{display:flex;align-items:center;gap:7px;flex:1;min-width:0;flex-wrap:wrap;}
  .roster-name{font-weight:600;}
  .status{
    margin-left:auto;font-family:'Space Mono',monospace;font-size:10.5px;
    text-transform:uppercase;padding:4px 9px;border-radius:var(--r-pill);flex-shrink:0;
    border:none;cursor:default;
  }
  .status.available{background:var(--green-bg);color:var(--green);}
  .status.unavailable{background:var(--red-bg);color:var(--red);}
  .status.clickable{cursor:pointer;}
  .status.clickable:active{transform:scale(0.96);}
  .comment-text{font-size:12px;color:var(--ink-soft);font-style:italic;margin-top:2px;width:100%;}
  .empty-note{font-size:12.5px;color:var(--ink-soft);}

  .note-form{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
  .note-form textarea{flex:1;min-width:130px;min-height:38px;}

  .copy-row{
    margin-top:14px;background:var(--bg);border:1px solid var(--line);
    border-radius:var(--r-control);padding:9px 4px 9px 10px;
    display:flex;gap:8px;align-items:flex-start;
  }
  .copy-row textarea{
    flex:1;border:none;background:transparent;font-family:'Space Mono',monospace;
    font-size:11px;color:var(--ink);padding:0;min-width:0;resize:none;
    line-height:1.5;overflow:hidden;
  }
  .copy-row button{height:30px;padding:0 12px;font-size:11.5px;flex-shrink:0;}

  /* posts */
  .post-composer{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .post-composer-row{display:flex;gap:8px;flex-wrap:wrap;}
  .post-composer input[type=text]{width:100%;font-weight:700;}
  .post-composer textarea{flex:1;min-width:160px;min-height:44px;}
  .post-composer button{flex-shrink:0;align-self:flex-start;}
  .post-hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .post-item{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);}
  .post-item:last-child{border-bottom:none;}
  .post-main{flex:1;min-width:0;}
  .post-meta{
    display:flex;justify-content:space-between;gap:8px;
    font-family:'Space Mono',monospace;font-size:10.5px;
    color:var(--ink-soft);margin-bottom:3px;
  }
  .post-author{font-weight:700;color:var(--ink);}
  .post-header{
    font-family:'Archivo',sans-serif;font-weight:800;font-size:14.5px;
    letter-spacing:-0.1px;margin:0 0 3px;cursor:pointer;
  }
  .post-text{font-size:13.5px;line-height:1.45;white-space:pre-wrap;cursor:pointer;}
  .post-text.clamped{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
  }
  .post-empty{font-size:12.5px;color:var(--ink-soft);}
  #viewAllPostsBtn{margin-top:8px;}
  .post-share-btn{
    flex-shrink:0;width:30px;height:30px;padding:0;margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    border:none;background:transparent;color:var(--ink-soft);
    border-radius:50%;cursor:pointer;
  }
  .post-share-btn:hover{background:var(--bg);color:var(--ink);}
  .post-share-btn:active{transform:scale(0.94);}
  .post-share-btn svg{width:17px;height:17px;display:block;}

  .share-menu{
    position:fixed;transform-origin:top right;
    min-width:170px;z-index:120;
  }

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(36,25,52,0.45);
    align-items:center;justify-content:center;padding:20px;z-index:100;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--card);border-radius:var(--r-card);
    max-width:460px;width:100%;max-height:80vh;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,0.25);
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .modal-head h3{font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;margin:0;}
  .modal-head button{height:30px;width:30px;padding:0;border-radius:50%;font-size:13px;flex-shrink:0;}
  .modal-list{overflow-y:auto;padding:4px 16px 16px;}

  .admin-section-label{
    font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;
    letter-spacing:1.5px;color:var(--ink-soft);margin:16px 0 8px;
  }
  .admin-section-label:first-child{margin-top:0;}
  .admin-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
  .admin-row:last-child{border-bottom:none;}
  .admin-row.editing{align-items:stretch;padding:10px 0;}
  .admin-row-main{flex:1;min-width:0;}
  .admin-row-title{font-weight:600;font-size:13.5px;}
  .admin-row-sub{font-size:11.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .admin-edit-form{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;}
  .admin-edit-form input[type=text]{width:100%;}
  .admin-edit-btn{
    flex-shrink:0;height:28px;padding:0 10px;font-size:11px;font-weight:600;
    border-radius:var(--r-pill);border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;
  }
  .admin-edit-btn:hover{background:var(--bg);}
  .admin-delete-btn{
    flex-shrink:0;height:28px;padding:0 10px;font-size:11px;font-weight:600;

  <div class="card">
    <div class="identity-block" style="padding-bottom:0;margin-bottom:0;border-bottom:none;">
      <div class="who-row">
        <span id="activeChip" title="Hold to edit your name and color"></span>
        <div class="dd" id="personDropdown">
          <button type="button" class="dd-trigger" id="personDropdownBtn">
            <span id="personDropdownLabel">Select your name…</span>
            <svg class="dd-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="dd-menu pop-menu" id="personDropdownMenu"></div>
        </div>
        <button class="ghost" id="newPersonBtn">+ New person</button>
      </div>
      <div class="tag-row" id="tagRow"></div>
      <div id="newPersonRow">
        <input type="text" id="newPersonName" placeholder="Your name">
        <div class="color-pick-row">
          <input type="color" id="colorPicker" value="#6b4c8a">
          <span class="color-hex" id="colorHex">#6B4C8A</span>
          <span class="hint">Pick any color you like</span>
        </div>
        <input type="tel" id="newPersonPhone" placeholder="Phone" required>
        <input type="email" id="newPersonEmail" placeholder="Email" required>
        <div style="display:flex; gap:8px;">
          <button id="addPersonBtn">Add me</button>
          <button class="ghost" id="cancelNewBtn">Cancel</button>
        </div>
      </div>
      <div id="editPersonRow">
        <span class="hint" style="margin:0 0 2px;">Editing your info</span>
        <input type="text" id="editPersonName" placeholder="Your name">
        <div class="color-pick-row">
          <input type="color" id="editPersonColor" value="#6b4c8a">
          <span class="color-hex" id="editPersonColorHex">#6B4C8A</span>
          <span class="hint">Pick any color you like</span>
        </div>
        <input type="tel" id="editPersonPhone" placeholder="Phone" required>
        <input type="email" id="editPersonEmail" placeholder="Email" required>
        <div style="display:flex; gap:8px;">
          <button id="saveEditPersonBtn">Save</button>
          <button class="ghost" id="cancelEditPersonBtn">Cancel</button>
        </div>
      </div>
    </div>

<script>
const DOW = ['S','M','T','W','T','F','S'];
const COACH_EMAIL = 'ronj.flash@gmail.com';
const COACH_ID = 'coach';
const COACH_COLOR = '#7a4fae';

const SHARE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
  <polyline points="16 6 12 2 8 6"/>
  <line x1="12" y1="2" x2="12" y2="15"/>
</svg>`;

const DD_CHEVRON = `<svg class="rsvp-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

let people = [];
let away = {};
let comments = {};
let events = {};
let rsvps = {};
let tags = {};
let posts = [];
let expandedPostIds = new Set();
let shareMenuPostId = null;
let shareMenuEventId = null;
let contactMenuEventId = null;
let secretTapCount = 0;
let secretTapTimer = null;
let activePersonId = null;
let viewYear, viewMonth;
let selectedDate = null;
let editMode = false;

const $ = id => document.getElementById(id);

const TAG_ICONS = {
  sick: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.5 14.1V5.3a2 2 0 1 0-4 0v8.8a4.1 4.1 0 1 0 4 0Z"/>
    <circle cx="10.5" cy="17.3" r="1.1" fill="currentColor" stroke="none"/>
    <line x1="12.5" y1="7.6" x2="14.6" y2="7.6"/>
    <line x1="12.5" y1="10.6" x2="14.6" y2="10.6"/>
  </svg>`,
  injured: `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <circle cx="3.4" cy="8.1" r="2.5"/>
    <circle cx="3.4" cy="16.9" r="2.5"/>
    <rect x="3.4" y="10.5" width="6.4" height="4.6"/>
    <circle cx="20.6" cy="7.1" r="2.5"/>
    <circle cx="20.6" cy="15.9" r="2.5"/>
    <rect x="14.6" y="9.1" width="6.4" height="4.6"/>
    <path d="M9.8 10.5 L14.6 13.7 M9.8 15.1 L14.6 9.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  </svg>`,
  cross_training: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="5.5" cy="17" r="3.3"/>
    <circle cx="18.5" cy="17" r="3.3"/>
    <path d="M5.5 17 L8.5 8 L15 8 L11.5 14 L5.5 17"/>
    <path d="M15 8 L18.5 17"/>
    <path d="M13.6 6.6 L16.4 6.6"/>
  </svg>`,
};

const TAG_DEFS = [
  { key: 'sick', label: 'Sick' },
  { key: 'injured', label: 'Injured' },
  { key: 'cross_training', label: 'Cross-training' },
];

const EVENT_TYPES = {
  practice: { label: 'Practice', color: 'var(--practice)', bg: 'var(--practice-bg)', text: 'var(--ink)' },
  meet:     { label: 'Meet',     color: 'var(--meet)',     bg: 'var(--meet-bg)',     text: 'var(--meet)' },
  other:    { label: 'Other',    color: 'var(--other)',    bg: 'var(--other-bg)',    text: 'var(--other)' },
};
const EVENT_TYPE_KEYS = Object.keys(EVENT_TYPES);
let selectedEventType = 'practice';
let editingEventId = null;
let adminEventType = 'practice';

function pad(n){return n<10?'0'+n:''+n;}
function keyOf(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`;}
function todayKey(){const t=new Date();return keyOf(t.getFullYear(),t.getMonth(),t.getDate());}

async function loadState(){
  try{
    const res = await fetch('/api/state');
    const data = await res.json();
    people = data.people || [];
    away = data.away || {};
    comments = data.comments || {};
    events = data.events || {};
    rsvps = data.rsvps || {};
    tags = data.tags || {};
    posts = data.posts || [];
  }catch(e){
    console.error('Load failed, starting empty', e);
    people = []; away = {}; comments = {}; events = {}; rsvps = {}; tags = {}; posts = [];
  }
}

async function apiPost(path, body){
  try{
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return await res.json();
  }catch(e){
    console.error('Request failed:', path, e);
    return null;
  }
}

async function savePerson(person){
  await apiPost('/api/people', person);
}

async function toggleAwayRemote(personId, dateKey){
  await apiPost('/api/away/toggle', { personId, date: dateKey });
}

async function saveCommentRemote(dateKey, personId, text){
  await apiPost('/api/comment', { date: dateKey, personId, text });
}

async function createEventRemote(dateKey, title, time, desc, type){
  return await apiPost('/api/events', { date: dateKey, title, time, desc, type });
}

async function updateEventRemote(eventId, title, time, desc, type){
  return await apiPost('/api/events/update', { eventId, title, time, desc, type });
}

async function saveRsvpRemote(eventId, personId, status){
  await apiPost('/api/rsvp', { eventId, personId, status });
}

async function toggleTagRemote(personId, tag){
  await apiPost('/api/tags/toggle', { personId, tag });
}

async function createPostRemote(personId, text, header){
  return await apiPost('/api/posts', { personId, text, header });
}

function isAway(personId, dateKey){ return (away[personId] || []).includes(dateKey); }

function toggleAway(personId, dateKey){
  if(!away[personId]) away[personId] = [];
  const idx = away[personId].indexOf(dateKey);
  if(idx >= 0) away[personId].splice(idx,1);
  else away[personId].push(dateKey);
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function personTagsHtml(personId){
  const mine = tags[personId] || [];
  if(!mine.length) return '';
  const icons = TAG_DEFS.filter(t => mine.includes(t.key))
    .map(t => `<span class="tag-icon" title="${escapeHtml(t.label)}">${TAG_ICONS[t.key]}</span>`)
    .join('');
  return `<span class="person-tags">${icons}</span>`;
}

function renderTagRow(){
  const row = $('tagRow');
  if(!activePersonId || activePersonId === COACH_ID){
    row.classList.remove('show');
    row.innerHTML = '';
    return;
  }
  row.classList.add('show');
  const mine = tags[activePersonId] || [];
  row.innerHTML = TAG_DEFS.map(t => `
    <button type="button" class="tag-btn ${mine.includes(t.key) ? 'active' : ''}" data-tag="${t.key}">
      ${TAG_ICONS[t.key]}<span>${t.label}</span>
    </button>
  `).join('');
  row.querySelectorAll('.tag-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleTag(btn.dataset.tag));
  });
}

async function toggleTag(tag){
  if(!activePersonId) return;
  if(!tags[activePersonId]) tags[activePersonId] = [];
  const idx = tags[activePersonId].indexOf(tag);
  if(idx >= 0) tags[activePersonId].splice(idx, 1);
  else tags[activePersonId].push(tag);
  await toggleTagRemote(activePersonId, tag);
  renderTagRow();
  renderPersonSelect();
  renderDayDetail();
}

function closePersonDropdown(){
  $('personDropdown').classList.remove('open');
  $('personDropdownMenu').classList.remove('show');
}

function selectPerson(personId){
  activePersonId = personId || null;
  closePersonDropdown();
  renderAll();
}

function renderPersonSelect(){
  const menu = $('personDropdownMenu');
  const options = [
    { id: '', label: 'Select your name…', color: null },
    { id: COACH_ID, label: 'Coach', color: COACH_COLOR },
    ...people.map(p => ({ id: p.id, label: p.name, color: p.color })),
  ];
  menu.innerHTML = options.map(o => `
    <button type="button" class="dd-option ${o.id===(activePersonId||'') ? 'active' : ''}" data-person-option="${o.id}">
      ${o.color ? `<span class="dot" style="background:${o.color}"></span>` : ''}${escapeHtml(o.label)}
    </button>
  `).join('');
  menu.querySelectorAll('[data-person-option]').forEach(btn=>{
    btn.addEventListener('click', ()=> selectPerson(btn.dataset.personOption));
  });

  const label = $('personDropdownLabel');
  const chip = $('activeChip');
  if(activePersonId === COACH_ID){
    label.textContent = 'Coach';
    chip.innerHTML = `<span class="active-chip"><span class="dot" style="background:${COACH_COLOR}"></span>Coach</span>`;
  } else if(activePersonId){
    const p = people.find(x=>x.id===activePersonId);
    label.textContent = p ? p.name : 'Select your name…';
    chip.innerHTML = p ? `<span class="active-chip"><span class="dot" style="background:${p.color}"></span>${escapeHtml(p.name)}${personTagsHtml(p.id)}</span>` : '';
  } else {
    label.textContent = 'Select your name…';
    chip.innerHTML = '';
  }
}

async function addPerson(name){
  name = name.trim();
  if(!name) return;
  const existing = people.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(existing){
    activePersonId = existing.id;
    renderAll();
    return;
  }
  const phone = $('newPersonPhone').value.trim();
  const email = $('newPersonEmail').value.trim();
  if(!phone){ $('newPersonPhone').focus(); return; }
  if(!email){ $('newPersonEmail').focus(); return; }
  const p = {
    id: 'p_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    name,
    color: $('colorPicker').value,
    phone,
    email
  };
  people.push(p);
  activePersonId = p.id;
  await savePerson(p);
  renderAll();
}

function openEditProfile(){
  const p = people.find(x=>x.id===activePersonId);
  if(!p) return;
  $('newPersonRow').classList.remove('show');
  $('editPersonName').value = p.name;
  $('editPersonColor').value = p.color;
  $('editPersonColorHex').textContent = p.color.toUpperCase();
  $('editPersonPhone').value = p.phone || '';
  $('editPersonEmail').value = p.email || '';
  $('editPersonRow').classList.add('show');
  $('editPersonName').focus();
  $('editPersonName').select();
}

async function saveEditProfile(){
  const p = people.find(x=>x.id===activePersonId);
  if(!p) return;
  const newName = $('editPersonName').value.trim();
  if(!newName){ $('editPersonName').focus(); return; }
  const phone = $('editPersonPhone').value.trim();
  const email = $('editPersonEmail').value.trim();
  if(!phone){ $('editPersonPhone').focus(); return; }
  if(!email){ $('editPersonEmail').focus(); return; }
  p.name = newName;
  p.color = $('editPersonColor').value;
  p.phone = phone;
  p.email = email;
  await savePerson(p);
  $('editPersonRow').classList.remove('show');
  renderAll();
}

function renderDow(){ $('dowRow').innerHTML = DOW.map(d=>`<div class="dow">${d}</div>`).join(''); }

function renderCalendar(){
  const label = new Date(viewYear, viewMonth, 1).toLocaleString('en-US',{month:'long', year:'numeric'});
  $('monthLabel').textContent = label;

  const firstDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const grid = $('calGrid');
  let html = '';
  for(let i=0;i<firstDow;i++) html += '<div class="day empty"></div>';

  for(let d=1; d<=daysInMonth; d++){
    const dk = keyOf(viewYear, viewMonth, d);
    const availablePeople = people.filter(p => !isAway(p.id, dk));
    let cls = 'day';
    if(dk === todayKey()) cls += ' today';
    if(dk === selectedDate) cls += ' selected';
    if(activePersonId && isAway(activePersonId, dk)) cls += ' you-away';
    if(editMode) cls += ' edit-target';
    const dayEvents = events[dk] || [];
    const typesPresent = EVENT_TYPE_KEYS.filter(t => dayEvents.some(ev => (ev.type || 'practice') === t));
    const marks = typesPresent.map(t => `<span class="e" style="background:${EVENT_TYPES[t].color}" title="${EVENT_TYPES[t].label}"></span>`).join('');
    const dots = availablePeople.slice(0,10).map(p=>`<span class="d" style="background:${p.color}"></span>`).join('');
    html += `<div class="${cls}" data-date="${dk}">
      <div class="num">${d}</div>
      <div class="event-marks">${marks}</div>
      <div class="dots">${dots}</div>
    </div>`;
  }
  grid.innerHTML = html;

  grid.querySelectorAll('.day:not(.empty)').forEach(el=>{
    el.addEventListener('click', ()=>onDayClick(el.dataset.date));
  });
}

function onDayClick(dateKey){
  if(editMode){
    if(!activePersonId){
      alert('Select your name first so we know whose availability to change.');
      return;
    }
    toggleAway(activePersonId, dateKey);
    toggleAwayRemote(activePersonId, dateKey);
    renderCalendar();
    if(selectedDate === dateKey) renderDayDetail();
    return;
  }
  selectedDate = dateKey;
  renderCalendar();
  renderDayDetail();
}

function setEditMode(on){
  editMode = on;
  $('editModeBtn').classList.toggle('active', on);
  $('editModeBtn').textContent = on ? 'Editing…' : 'Edit Availability';
  $('editBanner').classList.toggle('show', on);
  renderCalendar();
}

function getRsvp(eventId){
  if(!activePersonId) return 'unknown';
  return (rsvps[eventId] && rsvps[eventId][activePersonId]) || 'unknown';
}

async function cycleRsvp(eventId){
  if(!activePersonId){
    alert('Select your name first so we know whose RSVP to change.');
    return;
  }
  const order = ['unknown','available','unavailable'];
  const current = getRsvp(eventId);
  const next = order[(order.indexOf(current)+1) % order.length];
  if(!rsvps[eventId]) rsvps[eventId] = {};
  if(next === 'unknown') delete rsvps[eventId][activePersonId];
  else rsvps[eventId][activePersonId] = next;
  await saveRsvpRemote(eventId, activePersonId, next);
  renderEvents();
}

const rsvpLabel = {unknown:'Unknown', available:'Coming', unavailable:'Not coming'};

function renderEvents(){
  const list = events[selectedDate] || [];
  if(list.length === 0){
    $('eventsList').innerHTML = '<div class="no-events">No events scheduled yet.</div>';
  } else {
    $('eventsList').innerHTML = list.map(ev => {
      const status = getRsvp(ev.id);
      const evRsvps = rsvps[ev.id] || {};
      const availNames = [];
      const unavailNames = [];
      Object.keys(evRsvps).forEach(pid=>{
        const person = people.find(x=>x.id===pid);
        if(!person) return;
        if(evRsvps[pid] === 'available') availNames.push(person.name);
        else if(evRsvps[pid] === 'unavailable') unavailNames.push(person.name);
      });
      const et = EVENT_TYPES[ev.type] || EVENT_TYPES.practice;
      return `
      <div class="event-row">
        <div class="event-header">
          <span class="event-bar" style="background:${et.color}"></span>
          <span class="event-title">${escapeHtml(ev.title)}</span>
          <span class="event-type-pill" style="background:${et.bg};color:${et.text}">${et.label}</span>
          <span class="event-time">${escapeHtml(ev.time)}</span>
        </div>
        ${ev.desc ? `<div class="event-desc">${escapeHtml(ev.desc)}</div>` : ''}
        <div class="event-actions">
          ${isRealPerson() ? `<button class="rsvp-btn ${status}" data-event="${ev.id}">${rsvpLabel[status]}</button>` : ''}
          <button class="rsvp-btn share-btn" data-share="${ev.id}">Share${DD_CHEVRON}</button>
          <button class="rsvp-btn info-btn" data-contact="${ev.id}">Contact attendees${DD_CHEVRON}</button>
        </div>
        ${(availNames.length || unavailNames.length) ? `<div class="rsvp-summary">
          ${availNames.length ? `<div class="grp avail">✓ Coming: <b>${availNames.map(escapeHtml).join(', ')}</b></div>` : ''}
          ${unavailNames.length ? `<div class="grp unavail">✕ Not coming: <b>${unavailNames.map(escapeHtml).join(', ')}</b></div>` : ''}
        </div>` : ''}
      </div>
    `;
    }).join('');
    $('eventsList').querySelectorAll('.rsvp-btn[data-event]').forEach(btn=>{
      btn.addEventListener('click', ()=> cycleRsvp(btn.dataset.event));
    });
    $('eventsList').querySelectorAll('.share-btn').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        openEventShareMenu(btn, btn.dataset.share);
      });
    });
    $('eventsList').querySelectorAll('.info-btn[data-contact]').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        openContactMenu(btn, btn.dataset.contact);
      });
    });
  }
}

function shareEventToWhatsApp(ev){
  const msg = `New Event Posted: ${ev.title}${ev.time ? ' — ' + ev.time : ''}\n${window.location.href}`;
  const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

function shareEventViaSms(ev){
  const msg = `New Event Posted: ${ev.title}${ev.time ? ' — ' + ev.time : ''}\n${window.location.href}`;
  window.location.href = `sms:&body=${encodeURIComponent(msg)}`;
}

function findEventById(id){
  for(const date in events){
    const found = (events[date] || []).find(e => e.id === id);
    if(found) return found;
  }
  return null;
}

function openEventShareMenu(btn, eventId){
  shareMenuEventId = eventId;
  const menu = $('eventShareMenu');
  const rect = btn.getBoundingClientRect();
  menu.style.top = `${rect.bottom + 6}px`;
  menu.style.left = `${Math.max(8, rect.right - 190)}px`;
  menu.classList.add('show');
}

function closeEventShareMenu(){
  $('eventShareMenu').classList.remove('show');
  shareMenuEventId = null;
}

function openContactMenu(btn, eventId){
  contactMenuEventId = eventId;
  const menu = $('attendeesContactMenu');
  const rect = btn.getBoundingClientRect();
  menu.style.top = `${rect.bottom + 6}px`;
  menu.style.left = `${Math.max(8, rect.right - 190)}px`;
  menu.classList.add('show');
}

function closeContactMenu(){
  $('attendeesContactMenu').classList.remove('show');
  contactMenuEventId = null;
}

function formatEventDate(dateKey){
  const d = new Date(dateKey + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function attendeesFor(ev){
  const evRsvps = rsvps[ev.id] || {};
  return people.filter(p => evRsvps[p.id] === 'available');
}

function eventReminderText(ev){
  if(!ev){
    return { subject: 'Hawks Calendar', body: `\n\n${window.location.href}` };
  }
  const subject = `${ev.title}${ev.time ? ' — ' + ev.time : ''}`;
  const body = `Reminder: ${ev.title} on ${formatEventDate(ev.date)}${ev.time ? ' at ' + ev.time : ''}.${ev.desc ? '\n\n' + ev.desc : ''}\n\n${window.location.href}`;
  return { subject, body };
}

function emailCoach(ev){
  const { subject, body } = eventReminderText(ev);
  sendMailto(COACH_EMAIL, subject, body);
}

function emailTeam(ev){
  const emails = people.map(p => p.email).filter(Boolean);
  if(!emails.length){
    alert('No one on the roster has an email on file yet.');
    return;
  }
  const { subject, body } = eventReminderText(ev);
  sendMailto(emails.join(','), subject, body);
}

function emailAttendees(ev){
  const emails = attendeesFor(ev).map(p => p.email).filter(Boolean);
  if(!emails.length){
    alert("No one has RSVP'd as coming yet, so there's no one to email.");
    return;
  }
  const { subject, body } = eventReminderText(ev);
  sendMailto(emails.join(','), subject, body);
}

function textAttendees(ev){
  const phones = attendeesFor(ev).map(p => (p.phone || '').replace(/[^\d+]/g, '')).filter(Boolean);
  if(!phones.length){
    alert("No one has RSVP'd as coming yet, so there's no one to text.");
    return;
  }
  const body = `${ev.title}${ev.time ? ' at ' + ev.time : ''} on ${formatEventDate(ev.date)}.${ev.desc ? ' ' + ev.desc : ''}`;
  window.location.href = `sms:${phones.join(',')}?&body=${encodeURIComponent(body)}`;
}

function setEventType(type){
  if(!EVENT_TYPES[type]) return;
  selectedEventType = type;
  renderEventTypePicker();
}

function renderEventTypePicker(){
  const picker = $('eventTypePicker');

function setAdminEventType(type){
  if(!EVENT_TYPES[type]) return;
  adminEventType = type;
  renderAdminEventTypePicker();
}

function renderAdminEventTypePicker(){
  const picker = $('adminEditTypePicker');
  if(!picker) return;
  const idx = EVENT_TYPE_KEYS.indexOf(adminEventType);
  $('adminEditTypeSlider').style.transform = `translateX(${idx * 100}%)`;

async function addEvent(){
  const title = $('eventTitle').value.trim();
  const time = $('eventTime').value.trim();
  const desc = $('eventDesc').value.trim();
  if(!title){ $('eventTitle').focus(); return; }
  const result = await createEventRemote(selectedDate, title, time, desc, selectedEventType);
  const newEv = (result && result.event) ? result.event : {id:'e_'+Date.now(), date:selectedDate, title, time, desc, type:selectedEventType};
  if(!events[selectedDate]) events[selectedDate] = [];
  events[selectedDate].push(newEv);
  $('eventTitle').value=''; $('eventTime').value=''; $('eventDesc').value='';
  $('eventFormRow').classList.remove('show');
  setEventType('practice');
  renderEvents();
  renderCalendar();
}

function renderDayDetail(){
  const panel = $('dayDetail');
  if(!selectedDate){ panel.classList.remove('show'); return; }
  panel.classList.add('show');

  const dateObj = new Date(selectedDate + 'T00:00:00');
  $('detailTitle').textContent = dateObj.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});

  renderEvents();

  if(people.length === 0){
    $('detailList').innerHTML = '<div class="empty-note">No one on the roster yet — add your name above.</div>';
  } else {
    const dayComments = comments[selectedDate] || {};
    $('detailList').innerHTML = people.map(p=>{
      const away_ = isAway(p.id, selectedDate);
      const note = dayComments[p.id];
      const mine = p.id === activePersonId;
      return `<div class="roster-line">
        <div style="flex:1; min-width:0;">
          <div class="roster-main">
            <span class="dot" style="background:${p.color}"></span>
            <span class="roster-name">${escapeHtml(p.name)}</span>
            ${personTagsHtml(p.id)}
            <span class="status ${away_?'unavailable':'available'} ${mine?'clickable':''}" data-person="${p.id}">${away_?'Unavailable':'Available'}</span>
          </div>
          ${note ? `<div class="comment-text">"${escapeHtml(note)}"</div>` : ''}
        </div>
      </div>`;
    }).join('');

    if(activePersonId){
      const tag = $('detailList').querySelector(`.status.clickable[data-person="${activePersonId}"]`);
      if(tag){
        tag.addEventListener('click', async ()=>{
          toggleAway(activePersonId, selectedDate);
          await toggleAwayRemote(activePersonId, selectedDate);
          renderDayDetail();
          renderCalendar();
        });
      }
    }
  }

  const noteForm = $('noteForm');
  if(isRealPerson()){
    noteForm.style.display = 'flex';
    const existing = (comments[selectedDate] && comments[selectedDate][activePersonId]) || '';
    $('dayNote').value = existing;
  } else {
    noteForm.style.display = 'none';
  }

  renderCopyString();
}

async function saveNote(){
  const text = $('dayNote').value.trim();
  if(!comments[selectedDate]) comments[selectedDate] = {};
  if(text) comments[selectedDate][activePersonId] = text;
  else delete comments[selectedDate][activePersonId];
  await saveCommentRemote(selectedDate, activePersonId, text);
  renderDayDetail();
}

function renderCopyString(){
  const present = people.filter(p => !isAway(p.id, selectedDate)).map(p=>p.name);
  const str = present.length
    ? `Those available are: ${present.join(', ')}`
    : `Those available are: no one on the roster yet`;
  const ta = $('copyString');
  ta.value = str;
  ta.rows = Math.max(1, Math.ceil(str.length / 46));
}

function isRealPerson(){
  return !!activePersonId && activePersonId !== COACH_ID;
}

const POST_WINDOW_MS = 42 * 60 * 60 * 1000;

function relativeTime(ts){
  const diffMs = Date.now() - ts;
  const min = Math.floor(diffMs / 60000);
  if(min < 1) return 'just now';
  if(min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if(hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  return `${day}d ago`;
}

function postAuthorName(personId){
  if(personId === COACH_ID) return 'Coach';
  const p = people.find(x => x.id === personId);
  return p ? p.name : 'Team';
}

function sendMailto(recipients, subject, body){
  window.location.href = `mailto:${recipients}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function postReminderText(post){
  const subject = post.header || 'Team Post';
  const lead = post.header ? `${post.header}\n` : '';
  const body = `${lead}${postAuthorName(post.personId)}: ${post.text}\n\n${window.location.href}`;
  return { subject, body };
}

function sharePostToWhatsApp(post){
  const lead = post.header ? `*${post.header}*\n` : '';
  const msg = `${lead}${postAuthorName(post.personId)}: ${post.text}\n\n${window.location.href}`;
  window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
}

function emailPostToCoach(post){
  const { subject, body } = postReminderText(post);
  sendMailto(COACH_EMAIL, subject, body);
}

function emailPostToTeam(post){
  const emails = people.map(p => p.email).filter(Boolean);
  if(!emails.length){
    alert('No one on the roster has an email on file yet.');
    return;
  }
  const { subject, body } = postReminderText(post);
  sendMailto(emails.join(','), subject, body);
}

  menu.style.top = `${rect.bottom + 6}px`;
  menu.style.left = `${Math.max(8, rect.right - 190)}px`;
  menu.classList.add('show');
}

function closeShareMenu(){
  $('postShareMenu').classList.remove('show');
  shareMenuPostId = null;

function renderPostItem(post){
  const expanded = expandedPostIds.has(post.id);
  return `<div class="post-item">
    <div class="post-main">
      <div class="post-meta">
        <span class="post-author">${escapeHtml(postAuthorName(post.personId))}</span>
        <span>${relativeTime(post.createdAt)}</span>
      </div>
      ${post.header ? `<div class="post-header" data-post-toggle="${post.id}">${escapeHtml(post.header)}</div>` : ''}
      <div class="post-text ${expanded ? '' : 'clamped'}" data-post-toggle="${post.id}">${escapeHtml(post.text)}</div>
    </div>
    <button type="button" class="post-share-btn" data-post-share="${post.id}" title="Share">${SHARE_ICON}</button>
  </div>`;
}

function wirePostItems(container, rerender){
  container.querySelectorAll('[data-post-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.postToggle;
      if(expandedPostIds.has(id)) expandedPostIds.delete(id);
      else expandedPostIds.add(id);
      rerender();
    });
  });
  container.querySelectorAll('[data-post-share]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      if(activePersonId === COACH_ID){
        const post = posts.find(p => p.id === btn.dataset.postShare);
        if(post) emailPostToTeam(post);
        return;
      }
      openShareMenu(btn, btn.dataset.postShare);
    });
  });
}

function renderPosts(){
  const composer = $('postComposer');
  const hint = $('postHint');
  if(activePersonId){
    composer.style.display = 'flex';
    hint.style.display = 'none';
  } else {
    composer.style.display = 'none';
    hint.style.display = 'block';
  }

  const sorted = [...posts].sort((a, b) => b.createdAt - a.createdAt);
  const current = sorted.filter(p => Date.now() - p.createdAt < POST_WINDOW_MS);

  const list = $('postList');
  list.innerHTML = current.length
    ? current.map(renderPostItem).join('')
    : '<div class="post-empty">No posts in the last 42 hours.</div>';
  wirePostItems(list, renderPosts);
}

function renderPostModal(){
  const sorted = [...posts].sort((a, b) => b.createdAt - a.createdAt);
  const list = $('postModalList');
  list.innerHTML = sorted.length
    ? sorted.map(renderPostItem).join('')
    : '<div class="post-empty">No posts yet.</div>';
  wirePostItems(list, renderPostModal);
}

function renderAdminModal(){
  const peopleHtml = people.length
    ? people.map(p => `

        <span class="dot" style="background:${p.color}"></span>
        <div class="admin-row-main">
          <div class="admin-row-title">${escapeHtml(p.name)}</div>

        </div>
        <button type="button" class="admin-delete-btn" data-delete-person="${p.id}">Delete</button>
      </div>`).join('')
    : '<div class="admin-empty">No one on the roster.</div>';

  const sortedPosts = [...posts].sort((a, b) => b.createdAt - a.createdAt);
  const postsHtml = sortedPosts.length
    ? sortedPosts.map(post => `
      <div class="admin-row">
        <div class="admin-row-main">
          <div class="admin-row-title">${post.header ? escapeHtml(post.header) : escapeHtml(postAuthorName(post.personId))}</div>
          <div class="admin-row-sub">${post.header ? `${escapeHtml(postAuthorName(post.personId))}: ` : ''}${escapeHtml(post.text)}</div>
        </div>
        <button type="button" class="admin-delete-btn" data-delete-post="${post.id}">Delete</button>
      </div>`).join('')
    : '<div class="admin-empty">No posts yet.</div>';

  const allEvents = Object.values(events).flat().sort((a, b) => a.date.localeCompare(b.date));
  const eventsHtml = allEvents.length
    ? allEvents.map(ev => {
      if(ev.id === editingEventId){
        return `
      <div class="admin-row editing">
        <div class="admin-edit-form">
          <input type="text" id="adminEditTitle" value="${escapeHtml(ev.title)}" placeholder="Event title">
          <input type="text" id="adminEditTime" value="${escapeHtml(ev.time)}" placeholder="Time (e.g. 4:00 PM)">
          <textarea id="adminEditDesc" placeholder="Details">${escapeHtml(ev.desc)}</textarea>
          <div>
            <div class="event-type-label">Event type</div>
            <div class="event-type-picker" id="adminEditTypePicker">
              <div class="event-type-slider" id="adminEditTypeSlider"></div>
              <button type="button" class="event-type-opt" data-type="practice">Practice</button>
              <button type="button" class="event-type-opt" data-type="meet">Meet</button>
              <button type="button" class="event-type-opt" data-type="other">Other</button>
            </div>
          </div>
          <div class="btn-row">
            <button type="button" data-save-event="${ev.id}">Save</button>
            <button type="button" class="ghost" data-cancel-event-edit="1">Cancel</button>
          </div>
        </div>
      </div>`;
      }
      const et = EVENT_TYPES[ev.type] || EVENT_TYPES.practice;
      return `
      <div class="admin-row">
        <span class="dot" style="background:${et.color}" title="${et.label}"></span>
        <div class="admin-row-main">
          <div class="admin-row-title">${escapeHtml(ev.title)}</div>
          <div class="admin-row-sub">${formatEventDate(ev.date)}${ev.time ? ' · ' + escapeHtml(ev.time) : ''}</div>
        </div>
        <button type="button" class="admin-edit-btn" data-edit-event="${ev.id}">Edit</button>
        <button type="button" class="admin-delete-btn" data-delete-event="${ev.id}">Delete</button>
      </div>`;
    }).join('')
    : '<div class="admin-empty">No events yet.</div>';

  $('adminModalList').innerHTML = `
    <div class="admin-section-label">People</div>
    ${peopleHtml}
    <div class="admin-section-label">Posts</div>
    ${postsHtml}
    <div class="admin-section-label">Events</div>
    ${eventsHtml}
  `;

  $('adminModalList').querySelectorAll('[data-delete-person]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.deletePerson;
      const p = people.find(x => x.id === id);
      if(!confirm(`Delete ${p ? p.name : 'this person'} and all their data? This can't be undone.`)) return;
      await apiPost('/api/people/delete', { personId: id });
      people = people.filter(x => x.id !== id);
      if(activePersonId === id) activePersonId = null;
      renderAdminModal();
      renderAll();
    });
  });
  $('adminModalList').querySelectorAll('[data-delete-post]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Delete this post?')) return;
      const id = btn.dataset.deletePost;
      await apiPost('/api/posts/delete', { postId: id });
      posts = posts.filter(x => x.id !== id);
      renderAdminModal();
      renderPosts();
    });
  });
  $('adminModalList').querySelectorAll('[data-delete-event]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Delete this event?')) return;
      const id = btn.dataset.deleteEvent;
      await apiPost('/api/events/delete', { eventId: id });
      for(const date in events){
        events[date] = events[date].filter(x => x.id !== id);
        if(!events[date].length) delete events[date];
      }
      renderAdminModal();
      renderEvents();
      renderCalendar();
    });
  });
  $('adminModalList').querySelectorAll('[data-edit-event]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const ev = findEventById(btn.dataset.editEvent);
      if(!ev) return;
      editingEventId = ev.id;
      adminEventType = ev.type || 'practice';
      renderAdminModal();
    });
  });
  $('adminModalList').querySelectorAll('[data-cancel-event-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingEventId = null;
      renderAdminModal();
    });
  });
  $('adminModalList').querySelectorAll('[data-save-event]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.saveEvent;
      const title = $('adminEditTitle').value.trim();
      const time = $('adminEditTime').value.trim();
      const desc = $('adminEditDesc').value.trim();
      if(!title){ $('adminEditTitle').focus(); return; }
      await updateEventRemote(id, title, time, desc, adminEventType);
      const ev = findEventById(id);
      if(ev){ ev.title = title; ev.time = time; ev.desc = desc; ev.type = adminEventType; }
      editingEventId = null;
      renderAdminModal();
      renderEvents();
      renderCalendar();
    });
  });
  if(editingEventId) renderAdminEventTypePicker();
}

async function submitPost(){
  if(!activePersonId) return;
  const text = $('postText').value.trim();
  const header = $('postHeaderInput').value.trim();
  if(!text) return;
  const result = await createPostRemote(activePersonId, text, header);
  const newPost = (result && result.post)
    ? result.post
    : { id: 'post_' + Date.now(), personId: activePersonId, text, header, createdAt: Date.now() };
  posts.push(newPost);
  $('postText').value = '';
  $('postHeaderInput').value = '';
  renderPosts();
}

  if(!isRealPerson() && editMode) setEditMode(false);
  renderCalendar();
  renderDayDetail();
}

}

async function init(){
  const t = new Date();
  viewYear = t.getFullYear();
  viewMonth = t.getMonth();
  selectedDate = todayKey();
  renderDow();
  wireUI();
  renderEventTypePicker();
  await loadState();
  renderAll();

  // Light background refresh so people see each other's changes without
  // reloading. Skips a cycle if a form is open so it doesn't yank the page
  // out from under someone mid-edit.
  setInterval(async ()=>{
    const formOpen = $('newPersonRow').classList.contains('show')
      || $('editPersonRow').classList.contains('show')
      || $('eventFormRow').classList.contains('show')
      || editMode;
    if(formOpen) return;
    await loadState();
    renderAll();
  }, 20000);
}

init();
</script>
</body>
</html>
